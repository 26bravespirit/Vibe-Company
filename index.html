                        {"🔒 如何强制执行？"}

                      <div style={{ fontSize: 12, lineHeight: 1.7, color: "#94A3B8" }}>
                        {"三道防线："}
                        <strong style={{ color: "#FBBF24" }}>{"① Prompt 模板内嵌规范"}</strong>
                        {"（Agent 生成代码时自动遵循）→ "}
                        <strong style={{ color: "#FF6B35" }}>{"② CI 自动化检查"}</strong>

          {/* ══════ TAB: Roles ══════ */}

              <div style={{
                background: "#0D1117", borderRadius: 18,
                border: "1px solid rgba(239,68,68,0.15)",

              }}>
                <div style={{
                  fontSize: 18, fontWeight: 700, color: "#F1F5F9", marginBottom: 4,

                {/* Lifecycle flow */}
                <div style={{ position: "relative" }}>
                  {S7_DEBT_LIFECYCLE.map((d, i) => {
                    const rgb = d.color === "#60A5FA" ? "96,165,250" : d.color === "#FBBF24" ? "251,191,36" : d.color === "#A78BFA" ? "167,139,250" : d.color === "#FF6B35" ? "255,107,53" : d.color === "#EF4444" ? "239,68,68" : "52,211,153";

                      <div key={i} style={{

                          flex: 1, padding: "12px 16px",
                          background: "rgba(" + rgb + ",0.03)",
                          border: "1px solid rgba(" + rgb + ",0.1)",

                        }}>
                          <div style={{
                            fontSize: 14, fontWeight: 700, color: d.color,
                            marginBottom: 4, fontFamily: "'JetBrains Mono'",
                          }}>{"Phase " + (i + 1) + "：" + d.phase}</div>
                          <div style={{ fontSize: 12.5, lineHeight: 1.7, color: "#94A3B8" }}>{d.desc}</div>

                      </div>

                  {/* Loop arrow */}
                  <div style={{
                    textAlign: "center", marginTop: 8,
                    fontSize: 12, color: "#475569", fontStyle: "italic",
                  }}>
                    {"↩ Phase 6 的复盘成果反哺 Phase 1 的扫描规则 —— 形成正向循环"}

                {/* 20% rule */}
                <div style={{
                  marginTop: 20, padding: "16px 20px",
                  background: "rgba(239,68,68,0.04)",
                  border: "1px solid rgba(239,68,68,0.12)",
                  borderRadius: 14,
                }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#EF4444", marginBottom: 8 }}>
                    {"📏 核心纪律：20% 容量红线"}
                  </div>
                  <p style={{ fontSize: 13, lineHeight: 1.85, color: "#94A3B8", margin: 0 }}>
                    {"每个迭代周期（通常 1-2 周），"}
                    <strong style={{ color: "#FBBF24" }}>{"所有执行层小组必须预留至少 20% 的容量用于技术债清理"}</strong>
                    {"。这不是建议，是强制规则。就像金融领域的准备金制度——短期看「浪费」了产能，长期看避免了系统性崩溃。"}
                  </p>
                  <div style={{
                    display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginTop: 12,
                  }}>
                    <div style={{
                      padding: "10px", borderRadius: 8, textAlign: "center",
                      background: "rgba(52,211,153,0.04)",
                      border: "1px solid rgba(52,211,153,0.08)",
                    }}>
                      <div style={{ fontSize: 20, fontWeight: 800, color: "#34D399", fontFamily: "'JetBrains Mono'" }}>{"80%"}</div>
                      <div style={{ fontSize: 10, color: "#94A3B8" }}>{"新功能开发"}</div>
                    </div>
                    <div style={{
                      padding: "10px", borderRadius: 8, textAlign: "center",
                      background: "rgba(239,68,68,0.04)",
                      border: "1px solid rgba(239,68,68,0.08)",
                    }}>
                      <div style={{ fontSize: 20, fontWeight: 800, color: "#EF4444", fontFamily: "'JetBrains Mono'" }}>{"15%"}</div>
                      <div style={{ fontSize: 10, color: "#94A3B8" }}>{"技术债清理"}</div>
                    </div>
                    <div style={{
                      padding: "10px", borderRadius: 8, textAlign: "center",
                      background: "rgba(96,165,250,0.04)",
                      border: "1px solid rgba(96,165,250,0.08)",
                    }}>
                      <div style={{ fontSize: 20, fontWeight: 800, color: "#60A5FA", fontFamily: "'JetBrains Mono'" }}>{"5%"}</div>
                      <div style={{ fontSize: 10, color: "#94A3B8" }}>{"技术预研探索"}</div>
                    </div>
                  </div>
                </div>

                {/* Who owns the debt */}
                <div style={{
                  marginTop: 14, padding: "16px 20px",
                  background: "rgba(251,191,36,0.04)",
                  border: "1px solid rgba(251,191,36,0.1)",
                  borderRadius: 14,
                }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#FBBF24", marginBottom: 8 }}>
                    {"🏷️ 谁欠的债谁来还——但不是惩罚，是闭环"}
                  </div>
                  <p style={{ fontSize: 12.5, lineHeight: 1.85, color: "#94A3B8", margin: 0 }}>
                    {"技术债看板上每笔债务都标注了来源小组。清理时优先由产生该债务的小组负责修复——"}
                    <strong style={{ color: "#34D399" }}>{"不是因为追责，而是因为他们最了解上下文，修复效率最高。"}</strong>
                    {"治理官的角色不是监工，而是帮助小组看到自己产生的债务模式，从而在下一次攻坚中自然避免。"}
                    {"长期目标是："}
                    <strong style={{ color: "#FBBF24" }}>{"让技术债的产生速度低于清理速度，最终实现动态平衡。"}</strong>
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* ── Final Insight ── */}
          <div style={{
            width: "100%", maxWidth: 800, marginTop: 20, marginBottom: 24,
            padding: "22px 26px",
            background: "linear-gradient(135deg, rgba(96,165,250,0.06), rgba(52,211,153,0.04), rgba(239,68,68,0.04))",
            borderRadius: 16,
            border: "1px solid rgba(96,165,250,0.12)",
          }}>
            <div style={{
              fontSize: 14, fontWeight: 700, color: "#E2E8F0", marginBottom: 10,
              fontFamily: "'Sora','Noto Sans SC'",
            }}>{"📝 底座层的哲学"}</div>
            <p style={{ fontSize: 13.5, lineHeight: 2, color: "#94A3B8", margin: 0 }}>
              {"底座层不生产功能，但它生产 "}
              <strong style={{ color: "#60A5FA" }}>{"秩序"}</strong>
              {"。它的存在感应该像空气——平时感觉不到，但一旦消失就窒息。"}
              {"新增的 "}
              <strong style={{ color: "#EF4444" }}>{"技术债治理官"}</strong>
              {" 是这个体系的核心新角色：他不是在减慢速度，而是在确保速度可持续。"}
              {"就像高速公路需要养护团队——"}
              <strong style={{ color: "#FBBF24" }}>
                {"攻坚小组负责开得快，底座层负责让路一直是好路。"}
              </strong>
            </p>
          </div>
        </div>
      );

    /* ═══════════════════════════════════════════════════════════════════════════ */
    /* STICKY NAVIGATION & MAIN APP */
    /* ═══════════════════════════════════════════════════════════════════════════ */

    const SECTIONS = [
      { id: "section1", label: "Vibe Coding 工作原理", icon: "💡" },
      { id: "section2", label: "传统开发 vs Vibe Coding", icon: "⚔️" },
      { id: "section3", label: "Vibe Coder 基础能力", icon: "🧠" },
      { id: "section4", label: "程序员软技能转型", icon: "🔄" },
      { id: "section5", label: "三层组织架构", icon: "🏛️" },
      { id: "section6", label: "AB岗深度解析", icon: "👥" },
      { id: "section7", label: "技术底座层", icon: "🏰" },
    ];

    function StickyNav({ activeSection }) {
      return (
        <div style={{
          position: "fixed",
          top: 0,
          left: 0,
          bottom: 0,
          width: 220,
          background: "rgba(6, 8, 15, 0.97)",
          backdropFilter: "blur(12px)",
          borderRight: "1px solid rgba(30, 41, 59, 0.5)",
          zIndex: 1000,
          padding: "24px 0",
          boxSizing: "border-box",
          display: "flex",
          flexDirection: "column",
          overflowY: "auto",
        }}>
          <div style={{
            fontSize: 18,
            fontWeight: 800,
            background: "linear-gradient(135deg, #FBBF24, #FF6B35, #A78BFA)",
            WebkitBackgroundClip: "text",
            WebkitTextFillColor: "transparent",
            padding: "0 20px 20px",
            borderBottom: "1px solid rgba(30,41,59,0.4)",
            marginBottom: 12,
          }}>
            Vibe Company
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 4, padding: "0 12px" }}>
            {SECTIONS.map((section, idx) => {
              const isActive = activeSection === idx;
              return (
                <button
                  key={section.id}
                  onClick={() => {
                    const element = document.getElementById(section.id);
                    if (element) {
                      element.scrollIntoView({ behavior: "smooth" });
                    }
                  }}
                  style={{
                    padding: "10px 12px",
                    borderRadius: 8,
                    border: isActive ? "1px solid rgba(251,191,36,0.3)" : "1px solid transparent",
                    background: isActive ? "rgba(251,191,36,0.1)" : "transparent",
                    color: isActive ? "#FBBF24" : "#94A3B8",
                    fontSize: 12,
                    fontWeight: isActive ? 700 : 400,
                    cursor: "pointer",
                    transition: "all 0.2s",
                    textAlign: "left",
                    lineHeight: 1.5,
                    width: "100%",
                  }}>
                  <span style={{ marginRight: 6 }}>{section.icon}</span>
                  {section.label}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function App() {
      const [activeSection, setActiveSection] = useState(0);

      useEffect(() => {
        const handleScroll = () => {
          const scrollPos = window.scrollY + 100;
          for (let i = SECTIONS.length - 1; i >= 0; i--) {
            const element = document.getElementById(SECTIONS[i].id);
            if (element && element.offsetTop <= scrollPos) {
              setActiveSection(i);
              break;
            }
          }
        };

        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      return (
        <div>
          <StickyNav activeSection={activeSection} />
          <div style={{ marginLeft: 220 }}>
            <div id="section1">
              <Section1_VibeCodingJourney />
            </div>
            <div id="section2">
              <Section2_Comparison />
            </div>
            <div id="section3">
              <Section3_VibCoderSkills />
            </div>
            <div id="section4">
              <Section4_DevSoftSkills />
            </div>
            <div id="section5">
              <Section5_OrgArchitecture />
            </div>
            <div id="section6">
              <Section6_ABRoles />
            </div>
            <div id="section7">
              <Section7_TechFoundation />
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
